<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opinion Exchange Lessons</title>
    <style>
        :root {
            /* Cool, calm, and professional color palette */
            --primary: #2c5282;       /* Deep calm blue */
            --primary-light: #90cdf4; /* Soft light blue */
            --bg-color: #f7fafc;      /* Cool off-white background */
            --card-bg: #ffffff;       /* White for cards */
            --text-dark: #2d3748;     /* Dark slate gray for readability */
            --text-light: #718096;    /* Medium slate gray for secondary text */
            --border: #e2e8f0;        /* Light cool gray for borders */
            --accent: #319795;        /* Calm teal for buttons and highlights */
            --success: #2c5282;       /* Deep calm blue */
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            line-height: 1.7;
            margin: 0;
            padding: 0;
        }

        /* Hide Japanese Text when toggled */
        body.hide-jpn .jpn-text { display: none !important; }
        
        /* Fix article grid alignment when Japanese is hidden */
        body.hide-jpn .article-grid { grid-template-columns: 1fr !important; }
        
        .toggle-jpn-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .toggle-jpn-btn:hover {
            background: #285e61; /* Slightly darker teal */
        }

        /* --- DYNAMIC HERO HEADER STYLES --- */
        .hero {
            position: relative;
            padding: 80px 20px;
            text-align: center;
            border-bottom: 5px solid var(--primary);
            background-color: var(--border); /* Subdued fallback color */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.5s ease-in-out;
        }

        /* Overlay to keep text readable over the changing background images */
        .hero::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(247, 250, 252, 0.90); /* Cool light overlay */
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2; /* Keeps text above the overlay */
        }

        .hero-title {
            font-size: 3rem;
            font-weight: 900;
            color: black;
            margin: 0;
            text-shadow: none; 
        }

        .container {
            max-width: 1600px; 
            margin: 20px auto; 
            padding: 0 15px;
        }

        .class-selector {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        select {
            padding: 10px;
            font-size: 1rem;
            border: 1px solid var(--primary-light);
            border-radius: 8px;
            min-width: 200px;
            color: var(--text-dark);
            outline: none;
        }
        
        select:focus {
            border-color: var(--primary);
        }

        /* 4-Column Grid Layout */
        .opinion-layout {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 1200px) {
            .opinion-layout {
                grid-template-columns: 1fr 1fr; 
            }
        }

        @media (max-width: 768px) {
            .opinion-layout {
                grid-template-columns: 1fr; 
            }
            .article-grid {
                grid-template-columns: 1fr !important;
            }
        }

        .opinion-column {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
        }
        
        .topics-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .topic-card {
            background: var(--card-bg);
            padding: 18px;
            border-radius: 8px;
            border: 1px solid var(--border);
            border-top: 4px solid var(--primary-light);
            transition: all 0.3s ease;
        }
        
        .topic-title {
            font-weight: 700;
            color: var(--primary);
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 1.1rem;
        }
        
        .subtopic-list {
            margin: 0;
            padding-left: 20px;
            color: var(--text-dark);
            font-size: 0.95rem;
        }
        
        .subtopic-list li {
            margin-bottom: 8px;
        }

        .question-list { list-style-type: none; padding: 0; }
        .question-list li {
            padding: 12px 0;
            border-bottom: 1px dashed var(--border);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .grammar-box, .expression-box {
            background: #f0f4f8; /* Very faint tint of cool blue/gray */
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        
        .example-list { padding-left: 0; list-style: none; margin-bottom: 0; }
        .example-list li { padding: 12px 0; border-bottom: 1px dashed var(--border); display: flex; align-items: flex-start; gap: 10px; }
        .example-list li:last-child { border-bottom: none; }
        .example-text { font-size: 0.95rem; display: block; font-weight: 500; color: var(--text-dark); margin-top: 4px; }
        .example-trans { color: var(--text-light); font-size: 0.88rem; display: block; margin-top: 6px; }

        .guide-box {
            background: var(--card-bg);
            border-left: 3px solid var(--accent);
            padding: 8px 12px;
            margin-top: 6px;
            border-radius: 0 6px 6px 0;
            font-size: 0.83rem;
            color: var(--text-light);
            border-top: 1px solid var(--border);
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .guide-line {
            display: block;
            font-family: monospace, sans-serif;
            line-height: 1.5;
        }

        .audio-btn {
            background: none; border: none; cursor: pointer; font-size: 1.2rem;
            color: var(--primary); padding: 0; flex-shrink: 0; margin-top: 2px;
            opacity: 0.75;
            transition: opacity 0.2s;
        }

        .audio-btn:hover {
            opacity: 1;
        }

        u {
            text-decoration: underline;
            font-weight: 700;
            color: var(--primary);
        }

        /* Subdued Dropdown Styles */
        .toggle-example-btn {
            background: #f7fafc;
            color: var(--primary);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 10px;
            transition: background 0.2s;
        }
        
        .toggle-example-btn:hover { background: #edf2f7; }
        
        .example-dropdown {
            display: none;
            margin-top: 10px;
            background: #ffffff;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        
        .example-dropdown.active { display: block; }

        /* Checkbox & Completed State Styles */
        .completed {
            opacity: 0.45;
            background-color: #f1f5f9 !important; 
            border-color: var(--border) !important;
            filter: grayscale(60%);
        }

        .header-with-checkbox {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        input[type="checkbox"] {
            transform: scale(1.3);
            cursor: pointer;
            margin-top: 5px;
            accent-color: var(--accent);
        }
    </style>
</head>
<body>

    <!-- Hero Section -->
    <header class="hero" id="main-hero">
        <div class="hero-content">
            <h1 class="hero-title" id="header-lesson-title">Advanced Discussion Lessons</h1>
            <p style="color: black; font-weight: 700; font-size: 1.1rem; margin-top: 5px;" id="header-subtitle">CEFR B2 Level (50 Lessons)</p>
        </div>
    </header>

    <div class="container">
        <div class="class-selector">
            <label for="lessonSelect" style="font-weight: 600;">Select Lesson:</label>
            <select id="lessonSelect" onchange="loadLesson()"></select>
            <button class="toggle-jpn-btn" onclick="toggleJapanese()">Toggle Japanese</button>
        </div>
        <div id="lessonContent"></div>
    </div>

    <script src="curriculum.js"></script>
    <script>
        const defaultGuides = {
            "First off": ["> State main opinion", "> Introduce 'First off' + reason 1", "> Add supporting detail"],
            "Additionally": ["> Say point", "> Say reason 1", "> Say 'Additionally' + reason 2"],
            "Building on that": ["> State initial observation", "> Say 'Building on that' + expand logically", "> Explain broader impact"],
            "Another crucial aspect is": ["> Discuss primary perspective", "> Say 'Another crucial aspect is' + new dimension", "> Provide key details"],
            "All in all": ["> Summarize key arguments", "> Say 'All in all' + state final conclusion", "> State final outlook"]
        };

        function toggleJapanese() {
            document.body.classList.toggle('hide-jpn');
        }

        function playAudio(rawHtml) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = rawHtml.replace(/<[^>]*>/g, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'en-US'; 
                window.speechSynthesis.speak(utterance);
            }
        }

        function toggleExample(id) {
            const el = document.getElementById(id);
            if (el.classList.contains('active')) {
                el.classList.remove('active');
            } else {
                el.classList.add('active');
            }
        }

        function toggleComplete(checkbox, elementId) {
            const el = document.getElementById(elementId);
            if (checkbox.checked) {
                el.classList.add('completed');
            } else {
                el.classList.remove('completed');
            }
        }

        function initApp() {
            const selectEl = document.getElementById("lessonSelect");
            curriculum.forEach((lesson, index) => {
                const option = document.createElement("option");
                option.value = index;
                
                let optionTitle = lesson.title;
                if (optionTitle.includes(" - ")) {
                    optionTitle = optionTitle.substring(optionTitle.indexOf(" - ") + 3);
                }
                option.textContent = "Lesson " + (index + 1) + " - " + optionTitle;
                
                selectEl.appendChild(option);
            });
            
            loadLesson();
        }

        function loadLesson() {
            const index = parseInt(document.getElementById("lessonSelect").value);
            const lesson = curriculum[index];
            const container = document.getElementById("lessonContent");
            const heroEl = document.getElementById("main-hero");
            
            let displayTitle = lesson.title;
            if (displayTitle.includes(" - ")) {
                displayTitle = displayTitle.substring(displayTitle.indexOf(" - ") + 3);
            }
            
            document.getElementById("header-lesson-title").textContent = displayTitle;
            document.getElementById("header-subtitle").textContent = "Lesson " + (index + 1) + " | CEFR " + lesson.level;

            let bgImg = `header-${index + 1}.jpg`; 
            
            if (index === 0) {
                bgImg = "header-1.jpg";
            } else if (index === 1) {
                bgImg = "header-3.jpg";
            } else if (index === 2) {
                bgImg = "header-2.jpg"; 
            }
            
            heroEl.style.backgroundImage = `url('${bgImg}')`;

            const topicsToRender = lesson.topics || [
                { 
                    main: "Impact on Humans", 
                    mainJpn: "人間への影響",
                    sub: [
                        { eng: "Entry-level jobs", jpn: "エントリーレベルの仕事" },
                        { eng: "Creativity", jpn: "創造性" },
                        { eng: "Universal Basic Income (UBI)", jpn: "ユニバーサル・ベーシックインカム（UBI）" }
                    ] 
                },
                { 
                    main: "Ethics & Bias", 
                    mainJpn: "倫理とバイアス",
                    sub: [
                        { eng: "Algorithmic fairness", jpn: "アルゴリズムの公平性" },
                        { eng: "Data privacy", jpn: "データプライバシー" },
                        { eng: "Corporate accountability", jpn: "企業の説明責任" }
                    ] 
                },
                { 
                    main: "Education & Training", 
                    mainJpn: "教育とトレーニング",
                    sub: [
                        { eng: "Reskilling and upskilling", jpn: "リスキリングとアップスキリング" },
                        { eng: "AI-assisted learning", jpn: "AI支援による学習" },
                        { eng: "The shift in required qualifications", jpn: "求められる資格・スキルの変化" }
                    ] 
                }
            ];
            
            let html = ``;
                
            if (lesson.article) {
                html += `
                <div class="article-container" style="background: var(--card-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 30px; max-width: 1600px; margin-left: auto; margin-right: auto;">
                    <h3 style="color: var(--primary); text-align: center; margin-top: 0;">${lesson.article.title}</h3>
                    <div class="jpn-text" style="color: var(--text-light); text-align: center; margin-bottom: 20px;">${lesson.article.titleJpn}</div>
                    
                    <div class="article-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
                        <div style="font-weight: 700; border-bottom: 2px solid var(--border); padding-bottom: 10px; color: var(--text-dark);">English</div>
                        <div class="jpn-text" style="font-weight: 700; border-bottom: 2px solid var(--border); padding-bottom: 10px; color: var(--text-dark);">日本語訳 (Japanese Translation)</div>
                        
                        ${lesson.article.paragraphs.map(p => `
                            <div style="color: var(--text-dark); line-height: 1.8; font-size: 1.05rem;">
                                <button class="audio-btn" style="float: left; margin-right: 8px; font-size: 1.1rem;" onclick="playAudio('${p.eng.replace(/'/g, "\\'")}')">🔊</button>
                                ${p.eng}
                            </div>
                            <div class="jpn-text" style="color: var(--text-dark); line-height: 1.8; font-size: 1.05rem;">${p.jpn}</div>
                        `).join('')}
                    </div>
                </div>`;
            }

            html += `
                <div class="opinion-layout">
                    
                    <div class="opinion-column">
                        <h3 style="margin-top: 0;">Discussion Topics</h3>
                        <div class="topics-list">
                            ${topicsToRender.map((topic, idx) => `
                                <div class="topic-card" id="topic-box-${idx}">
                                    <div class="header-with-checkbox">
                                        <input type="checkbox" onchange="toggleComplete(this, 'topic-box-${idx}')">
                                        <div style="flex-grow: 1;">
                                            <h4 class="topic-title" style="margin-bottom: 4px;">
                                                ${topic.main}
                                                <div class="jpn-text" style="font-size: 0.85rem; color: var(--text-light); margin-top: 2px; font-weight: normal;">${topic.mainJpn}</div>
                                            </h4>
                                            <ul class="subtopic-list" style="margin-top: 10px;">
                                                ${topic.sub.map(s => `
                                                    <li>
                                                        ${s.eng}
                                                        <div class="jpn-text" style="font-size: 0.8rem; color: var(--text-light); margin-top: 2px;">${s.jpn}</div>
                                                    </li>
                                                `).join('')}
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="opinion-column">
                        <h3 style="margin-top: 0;">10 Discussion Questions</h3>
                        <ul class="question-list">
                            ${lesson.questions.map((q, idx) => `
                                <li id="question-box-${idx}">
                                    <div class="header-with-checkbox">
                                        <input type="checkbox" onchange="toggleComplete(this, 'question-box-${idx}')">
                                        <div>
                                            ${q.eng}
                                            <button class="audio-btn" style="font-size: 1rem; margin-left: 5px;" onclick="playAudio('${q.eng.replace(/'/g, "\\'")}')">🔊</button>
                                            <div class="jpn-text" style="color:var(--text-light); margin-top:4px;">${q.jpn}</div>
                                        </div>
                                    </div>
                                </li>
                            `).join('')}
                        </ul>
                    </div>

                    <div class="opinion-column">
                        <h3 style="margin-top: 0;">Transitional Expressions</h3>
                        <div class="expression-box">
                            <h4 style="margin:0 0 10px 0; color:var(--primary);">Expressions & Quick Guides</h4>
                            <ul style="padding-left: 0; list-style: none; margin: 0;">
                                ${lesson.expressions.map((exp, idx) => {
                                    const guideLines = exp.guide || defaultGuides[exp.eng] || [
                                        `> State initial point`,
                                        `> Say "${exp.eng}" + add supporting idea`,
                                        `> Conclude thought`
                                    ];
                                    
                                    let match = null;
                                    if (lesson.exampleAnswers) {
                                        match = lesson.exampleAnswers.find(ex => {
                                            const searchPhrase = exp.eng.toLowerCase().trim();
                                            const matchesTarget = ex.target && ex.target.toLowerCase().includes(searchPhrase);
                                            const matchesText = ex.eng && ex.eng.toLowerCase().includes(searchPhrase);
                                            return matchesTarget || matchesText;
                                        });
                                    }

                                    return `
                                        <li id="expression-box-${idx}" style="margin-bottom: 14px; border-bottom: 1px dashed var(--border); padding-bottom: 10px; transition: all 0.3s ease;">
                                            <div class="header-with-checkbox" style="justify-content: space-between;">
                                                <div style="display: flex; gap: 10px; align-items: flex-start;">
                                                    <input type="checkbox" onchange="toggleComplete(this, 'expression-box-${idx}')">
                                                    <div style="display: flex; flex-direction: column;">
                                                        <strong>${exp.eng}</strong>
                                                        ${exp.function ? `<span style="font-size: 0.85rem; color: var(--text-light); margin-top: 2px;">${exp.function}</span>` : ''}
                                                    </div>
                                                </div>
                                                <span class="jpn-text" style="font-size:0.85rem; color:var(--text-light);">${exp.jpn}</span>
                                            </div>
                                            <div class="guide-box" style="margin-left: 28px;">
                                                ${guideLines.map(line => `<span class="guide-line">${line}</span>`).join('')}
                                            </div>
                                            
                                            ${match ? `
                                                <div style="margin-left: 28px;">
                                                    <button class="toggle-example-btn" onclick="toggleExample('example-drop-${idx}')">View Example ⬇️</button>
                                                    <div id="example-drop-${idx}" class="example-dropdown">
                                                        <div style="display: flex; align-items: flex-start; gap: 10px;">
                                                            <button class="audio-btn" onclick="playAudio('${match.eng.replace(/'/g, "\\'").replace(/"/g, "&quot;").replace(/\n/g, " ")}')">🔊</button>
                                                            <div>
                                                                <div class="example-text">${match.eng.replace(/\n/g, "<br>")}</div>
                                                                <div class="example-trans jpn-text" style="margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px;">${match.jpn.replace(/\n/g, "<br>")}</div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            ` : ''}
                                        </li>
                                    `;
                                }).join('')}
                            </ul>
                        </div>
                    </div>

                    <div class="opinion-column">
                        <h3 style="margin-top: 0;">Grammar Points</h3>
                        ${lesson.grammarPoints.map((g, idx) => `
                            <div class="grammar-box" id="grammar-box-${idx}">
                                <div class="header-with-checkbox">
                                    <input type="checkbox" onchange="toggleComplete(this, 'grammar-box-${idx}')">
                                    <div style="flex-grow: 1;">
                                        <h4 style="margin:0 0 5px 0; color:var(--success);">${g.point}</h4>
                                        <p style="margin:0 0 5px 0; color: var(--text-dark);">${g.explanation}</p>
                                        <p class="jpn-text" style="margin:0 0 10px 0; font-size:0.85rem; color:var(--text-light);">${g.explanationJpn}</p>
                                        
                                        <ul class="example-list">
                                            ${g.examples.map(ex => `
                                                <li>
                                                    <button class="audio-btn" onclick="playAudio('${ex.eng.replace(/'/g, "\\'")}')">🔊</button>
                                                    <div>
                                                        <span class="example-text">${ex.eng}</span>
                                                        <span class="example-trans jpn-text">${ex.jpn}</span>
                                                    </div>
                                                </li>
                                            `).join('')}
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                </div>`;
            container.innerHTML = html;
        }

        window.onload = initApp;
    </script>
</body>
</html>
